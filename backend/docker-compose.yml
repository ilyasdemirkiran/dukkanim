services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gin_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    volumes:
      - ./google-services.json:/app/google-services.json
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  mongodb:
    image: mongo:7.0
    container_name: gin_mongodb
    restart: unless-stopped
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ 'CMD', 'mongosh', '--eval', "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
