services:
  mongodb:
    image: mongo:7.0
    container_name: dukkanim_mongodb
    restart: always
    command: ["--port", "${MONGO_PORT:-27888}"]
    ports:
      - "${MONGO_PORT:-27888}:${MONGO_PORT:-27888}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-dukkanim}
    volumes:
      - mongo_data:/data/db
    networks:
      - dukkanim_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukkanim_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4444}:${BACKEND_PORT:-4444}"
    volumes:
      - ./backend:/app
    environment:
      - PORT=${BACKEND_PORT:-4444}
      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT:-27888}
      - MONGO_ROOT_USER=${MONGO_ROOT_USER}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_DATABASE=${MONGO_DATABASE:-dukkanim}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - dukkanim_net

volumes:
  mongo_data:

networks:
  dukkanim_net:
    driver: bridge
